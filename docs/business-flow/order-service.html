<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Business Flow</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px/1.6 system-ui,
          sans-serif;
        color: #d8e0ee;
        background: #10141c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        padding: 20px 28px 14px;
        border-bottom: 1px solid #293140;
        background: #151b25;
      }
      header small {
        color: #9dabe0;
        letter-spacing: 0.18em;
        font-size: 10px;
      }
      h1 {
        font-size: 23px;
        margin: 3px 0;
      }
      header p {
        margin: 0;
        color: #97a5b9;
        font-size: 12px;
      }
      nav {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 28px;
        background: #151b25;
        border-bottom: 1px solid #293140;
      }
      input,
      select,
      button {
        font: inherit;
        color: inherit;
        background: #202937;
        border: 1px solid #3b475d;
        border-radius: 7px;
        padding: 7px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #32415c;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid #b6a1ff;
      }
      #search {
        width: 190px;
      }
      label {
        font-size: 12px;
        color: #b2bed0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        height: calc(100dvh - 190px);
        min-height: 460px;
      }
      .canvas {
        position: relative;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #1c2333 0%, #10141c 70%);
      }
      svg {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #graph {
        cursor: grab;
      }
      .node {
        cursor: pointer;
        transition: opacity 0.22s;
      }
      .node circle {
        stroke-width: 1.5;
      }
      .node text {
        fill: #dce4f2;
        font-size: 13px;
        paint-order: stroke;
        stroke: #141b27;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .node:focus {
        outline: none;
      }
      .node:focus circle {
        stroke: white;
        stroke-width: 3;
      }
      .edge {
        fill: none;
        stroke: #7f91b2;
        stroke-width: 1.4;
        transition: opacity 0.22s;
      }
      .edge.active {
        stroke: #b8a1ff;
        stroke-width: 2;
      }
      .edge.control {
        stroke: #8994a8;
        stroke-dasharray: 3 4;
      }
      .edge.fail {
        stroke: #ec8796;
      }
      .edge.pass {
        stroke: #80c7a3;
      }
      .branch-label {
        font: 11px system-ui;
        fill: #80c7a3;
        paint-order: stroke;
        stroke: #10141c;
        stroke-width: 4px;
        pointer-events: none;
      }
      .branch-label.fail {
        fill: #ec8796;
      }
      .edge.inferred {
        stroke-dasharray: 6 5;
      }
      .hint {
        position: absolute;
        bottom: 18px;
        left: 22px;
        color: #7e8ca4;
        font-size: 12px;
        pointer-events: none;
      }
      .zoom {
        position: absolute;
        right: 16px;
        bottom: 16px;
        display: flex;
        gap: 5px;
      }
      aside {
        border-left: 1px solid #293140;
        padding: 20px;
        overflow: auto;
        background: #151b25;
      }
      aside h2 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      aside h3 {
        font-size: 12px;
        color: #92a4c1;
        margin: 20px 0 6px;
      }
      aside p {
        font-size: 13px;
        color: #b4c0d3;
        overflow-wrap: anywhere;
      }
      aside ul {
        padding-left: 18px;
        font-size: 12px;
        color: #b4c0d3;
      }
      aside li {
        margin-bottom: 7px;
        overflow-wrap: anywhere;
      }
      .badge {
        display: inline-block;
        background: #2d2644;
        color: #cbb9ff;
        border-radius: 5px;
        font-size: 11px;
        padding: 2px 7px;
        margin-bottom: 12px;
      }
      .relation {
        border-top: 1px solid #303a4c;
        padding-top: 10px;
      }
      aside button {
        font-size: 12px;
        padding: 4px 8px;
      }
      .source {
        font-family: ui-monospace, monospace;
        color: #9baecb;
        font-size: 11px;
      }
      #status {
        position: absolute;
        top: 15px;
        left: 22px;
        font-size: 12px;
        color: #9dacbe;
      }
      .legend {
        display: flex;
        gap: 12px;
        margin-left: auto;
        font-size: 11px;
        color: #9facbf;
      }
      .legend span::before {
        content: '●';
        margin-right: 5px;
        color: var(--dot);
      }
      #results {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        width: 100%;
      }
      #results:empty {
        display: none;
      }
      #results button {
        font-size: 12px;
      }
      footer {
        padding: 7px 28px;
        color: #7e8ca4;
        font-size: 11px;
        border-top: 1px solid #293140;
      }
      @media (max-width: 800px) {
        main {
          grid-template-columns: 1fr;
          height: auto;
        }
        .canvas {
          height: 60dvh;
          min-height: 380px;
        }
        aside {
          border-left: 0;
          border-top: 1px solid #293140;
          max-height: 50dvh;
        }
        nav,
        header {
          padding-left: 16px;
          padding-right: 16px;
        }
        .legend {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <small>BUSINESS FLOW / SOURCE EXPLORER</small>
      <h1 id="title"></h1>
      <p id="scope"></p>
    </header>
    <nav aria-label="图谱控制">
      <input
        id="search"
        type="search"
        placeholder="搜索业务节点…"
        aria-label="搜索业务节点"
      /><label
        >方向
        <select id="direction">
          <option value="both">上下游</option>
          <option value="upstream">仅上游</option>
          <option value="downstream">仅下游</option>
        </select></label
      ><label
        >深度
        <select id="depth">
          <option value="1">1 层</option>
          <option value="2">2 层</option>
        </select></label
      ><label><input id="logic" type="checkbox" /> 包含业务逻辑校验</label
      ><label><input id="inferred" type="checkbox" /> 显示推测关系</label
      ><button id="collapse">收起展开</button><button id="reset">返回总览</button>
      <div class="legend">
        <span style="--dot: #efaa72">校验规则</span><span style="--dot: #b39af5">业务处理</span
        ><span style="--dot: #6bbac5">数据 / 存储</span
        ><span style="--dot: #d9b77a">参与者 / 结果</span>
      </div>
      <div id="results" aria-live="polite"></div>
    </nav>
    <main>
      <section class="canvas" aria-label="业务流程画布">
        <svg id="graph" aria-label="可交互业务图">
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#a795d0" />
            </marker>
          </defs>
          <g id="viewport">
            <g id="edges"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <div id="status" aria-live="polite"></div>
        <div class="hint">点击节点探索 · 再次点击收起 · 拖拽布局 · 滚轮缩放</div>
        <div class="zoom">
          <button id="fit" aria-label="适应全图">适应全图</button
          ><button id="zoom-in" aria-label="放大">＋</button
          ><button id="zoom-out" aria-label="缩小">－</button>
        </div>
      </section>
      <aside id="details" aria-live="polite"></aside>
    </main>
    <footer>
      依据源码归纳业务关系，不代表运行时追踪。实线为数据流，点线为执行顺序 /
      条件；绿色通过，红色拒绝；长虚线为推测。
    </footer>
    <script id="graph-data" type="application/json">
      {
        "version": 1,
        "title": "订单创建与支付 · 业务数据流",
        "scope": "分析随附订单示例的 6 个源文件：创建、库存预占、内存存储与支付状态更新。",
        "limitations": [
          "静态源码解读，未执行请求或采集运行时链路。",
          "路由注册是空实现；支付未连接外部支付网关。",
          "数据仅存于内存，未实现持久化、事务、鉴权或幂等保障。",
          "本图由当前代理依据示例源码生成，不代表已验证其他模型宿主的调用效果。",
          "详细视图按源码的 JavaScript 短路与比较语义展开，不额外假定整数、有限数、SKU 合法性或幂等校验。通过/拒绝边表示执行条件，不代表独立数据传输。"
        ],
        "questions": ["库存已扣减后若后续写入失败，是否需要补偿？当前示例未实现。"],
        "nodes": [
          {
            "id": "create",
            "label": "创建订单",
            "kind": "process",
            "summary": "校验请求、计算金额、预占库存后，将订单写入内存。",
            "core": true,
            "evidence": [{ "path": "src/orders.ts", "startLine": 4, "endLine": 9 }],
            "inputs": ["SKU、数量、单价"],
            "outputs": ["订单 ID、金额"],
            "states": ["created"]
          },
          {
            "id": "orders",
            "label": "订单存储",
            "kind": "store",
            "summary": "Map 中的订单；不是持久数据库。",
            "core": true,
            "evidence": [{ "path": "src/repository.ts", "startLine": 1, "endLine": 12 }],
            "inputs": ["新订单"],
            "outputs": ["按 ID 查询的订单"],
            "states": ["created → paid"]
          },
          {
            "id": "pay",
            "label": "处理支付",
            "kind": "process",
            "summary": "读取订单核对金额，写入支付记录，再修改订单状态；未接入支付网关。",
            "core": true,
            "evidence": [{ "path": "src/payments.ts", "startLine": 2, "endLine": 7 }],
            "inputs": ["订单 ID、支付金额"],
            "outputs": ["已付款订单"],
            "states": ["金额不匹配时抛错"]
          },
          {
            "id": "stock",
            "label": "库存预占",
            "kind": "process",
            "summary": "检查库存后扣减内存中的可用数量；库存不足时抛错。",
            "core": false,
            "evidence": [{ "path": "src/inventory.ts", "startLine": 1, "endLine": 8 }],
            "inputs": ["SKU、数量"],
            "outputs": ["库存扣减"],
            "states": ["可用库存减少"]
          },
          {
            "id": "validate",
            "label": "订单校验与计价",
            "kind": "process",
            "summary": "拒绝缺失 SKU、非正数量、负单价；数量乘以单价得到总额。",
            "core": false,
            "evidence": [{ "path": "src/validation.ts", "startLine": 1, "endLine": 6 }],
            "inputs": ["SKU、数量、单价"],
            "outputs": ["总金额"],
            "states": ["无效参数时抛错"]
          },
          {
            "id": "payments",
            "label": "支付记录",
            "kind": "store",
            "summary": "支付记录保存在内存数组中。",
            "core": false,
            "evidence": [{ "path": "src/repository.ts", "startLine": 13, "endLine": 16 }],
            "inputs": ["订单 ID、金额"],
            "outputs": ["记录数量"],
            "states": []
          },
          {
            "id": "paid",
            "label": "更新已付状态",
            "kind": "process",
            "summary": "查找订单并将其 status 修改为 paid。",
            "core": false,
            "evidence": [{ "path": "src/repository.ts", "startLine": 17, "endLine": 21 }],
            "inputs": ["订单 ID"],
            "outputs": ["已更新订单"],
            "states": ["created → paid"]
          },
          {
            "id": "rule-sku",
            "label": "SKU 真值检查",
            "kind": "rule",
            "layer": "detail",
            "parentId": "create",
            "summary": "原始条件 !input.sku；只检查 JavaScript 真值，不验证 SKU 存在或去除空白。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/validation.ts", "startLine": 1, "endLine": 3 }],
            "rule": {
              "condition": "Boolean(input.sku)",
              "onPass": "继续检查数量",
              "onFail": "抛出 Error(\"订单参数无效\")；不计价、不扣库存、不保存"
            }
          },
          {
            "id": "rule-quantity",
            "label": "拒绝非正数量",
            "kind": "rule",
            "layer": "detail",
            "parentId": "create",
            "summary": "原始拒绝条件 quantity \u003c= 0；没有整数、有限数或运行时类型检查。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/validation.ts", "startLine": 1, "endLine": 3 }],
            "rule": {
              "condition": "!(input.quantity \u003c= 0)",
              "onPass": "继续检查单价",
              "onFail": "抛出 Error(\"订单参数无效\")；终止创建"
            }
          },
          {
            "id": "rule-price",
            "label": "拒绝负单价",
            "kind": "rule",
            "layer": "detail",
            "parentId": "create",
            "summary": "原始拒绝条件 price \u003c 0；允许零价，未校验 NaN、无穷值或运行时类型。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/validation.ts", "startLine": 1, "endLine": 3 }],
            "rule": {
              "condition": "!(input.price \u003c 0)",
              "onPass": "计算订单金额",
              "onFail": "抛出 Error(\"订单参数无效\")；终止创建"
            }
          },
          {
            "id": "calculate-total",
            "label": "计算订单总额",
            "kind": "process",
            "layer": "detail",
            "parentId": "create",
            "summary": "total = quantity * price；没有货币精度或舍入处理。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [
              { "path": "src/validation.ts", "startLine": 4, "endLine": 6 },
              { "path": "src/orders.ts", "startLine": 6, "endLine": 6 }
            ]
          },
          {
            "id": "rule-stock",
            "label": "可用库存是否足够",
            "kind": "rule",
            "layer": "detail",
            "parentId": "create",
            "summary": "不存在的 SKU 按库存 0 比较；检查通过后才扣减库存。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/inventory.ts", "startLine": 2, "endLine": 8 }],
            "rule": {
              "condition": "(inventory.get(sku) ?? 0) \u003e= quantity",
              "onPass": "扣减可用库存，随后保存订单",
              "onFail": "抛出 Error(\"库存不足\")；本次不扣减、不保存订单"
            }
          },
          {
            "id": "invalid-order",
            "label": "拒绝：订单参数无效",
            "kind": "outcome",
            "layer": "detail",
            "parentId": "create",
            "summary": "前三项短路校验中任一拒绝，即抛出 Error(\"订单参数无效\")。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/validation.ts", "startLine": 1, "endLine": 3 }]
          },
          {
            "id": "no-stock",
            "label": "拒绝：库存不足",
            "kind": "outcome",
            "layer": "detail",
            "parentId": "create",
            "summary": "库存校验失败时终止创建；示例没有 HTTP 错误映射。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/inventory.ts", "startLine": 2, "endLine": 8 }]
          },
          {
            "id": "rule-order-exists",
            "label": "支付前订单存在性",
            "kind": "rule",
            "layer": "detail",
            "parentId": "pay",
            "summary": "按订单 ID 查询 Map，找不到订单则抛错。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [
              { "path": "src/repository.ts", "startLine": 8, "endLine": 12 },
              { "path": "src/payments.ts", "startLine": 2, "endLine": 7 }
            ],
            "rule": {
              "condition": "Boolean(orders.get(input.orderId))",
              "onPass": "返回订单并核对支付金额",
              "onFail": "抛出 Error(\"订单不存在\")；不写支付记录"
            }
          },
          {
            "id": "rule-amount",
            "label": "支付金额严格匹配",
            "kind": "rule",
            "layer": "detail",
            "parentId": "pay",
            "summary": "原始拒绝条件 order.total !== input.amount；不做金额转换或容差比较。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/payments.ts", "startLine": 2, "endLine": 7 }],
            "rule": {
              "condition": "order.total === input.amount",
              "onPass": "保存支付记录，随后更新订单状态",
              "onFail": "抛出 Error(\"支付金额不匹配\")；不记录支付、不修改订单状态"

          },
          {
            "id": "missing-order",
            "label": "拒绝：订单不存在",
            "kind": "outcome",
            "layer": "detail",
            "parentId": "pay",
            "summary": "findOrder 未命中时抛出 Error(\"订单不存在\")；既可发生在支付入口，也可发生在更新状态时。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [
              { "path": "src/repository.ts", "startLine": 8, "endLine": 12 },
              { "path": "src/repository.ts", "startLine": 17, "endLine": 21 }
            ]
          },
          {
            "id": "amount-mismatch",
            "label": "拒绝：金额不匹配",
            "kind": "outcome",
            "layer": "detail",
            "parentId": "pay",
            "summary": "抛出 Error(\"支付金额不匹配\")；当前示例未进行真实扣款。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/payments.ts", "startLine": 2, "endLine": 7 }]
          },
          {
            "id": "rule-update-exists",
            "label": "更新前再次查订单",
            "kind": "rule",
            "layer": "detail",
            "parentId": "paid",
            "summary": "markOrderPaid 再次调用 findOrder；支付记录在这一步之前已写入，源码未提供事务回滚。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [
              { "path": "src/repository.ts", "startLine": 17, "endLine": 21 },
              { "path": "src/repository.ts", "startLine": 8, "endLine": 12 }
            ],
            "rule": {
              "condition": "Boolean(orders.get(id))",
              "onPass": "将已存订单的 status 改成 paid",
              "onFail": "抛出 Error(\"订单不存在\")；已有支付记录不会自动撤销"
            }
          },
          {
            "id": "write-paid",
            "label": "写入 paid 状态",
            "kind": "process",
            "layer": "detail",
            "parentId": "paid",
            "summary": "原地修改 order.status 为 paid，返回该订单；没有重复支付或原状态检查。",
            "core": false,
            "inputs": [],
            "outputs": [],
            "states": [],
            "evidence": [{ "path": "src/repository.ts", "startLine": 17, "endLine": 21 }]
          }
        ],
        "edges": [
          {
            "id": "validate",
            "source": "create",
            "target": "validate",
            "label": "校验订单输入",
            "status": "supported",
            "reason": "createOrder 调用 validateOrder 和 calculateTotal。",
            "evidence": [
              { "path": "src/orders.ts", "startLine": 5, "endLine": 6 },
              { "path": "src/validation.ts", "startLine": 1, "endLine": 6 }
            ],
            "view": "overview"
          },
          {
            "id": "total",
            "source": "validate",
            "target": "create",
            "label": "返回计算金额",
            "status": "supported",
            "reason": "calculateTotal 返回数量乘单价，createOrder 接收 total。",
            "evidence": [
              { "path": "src/orders.ts", "startLine": 6, "endLine": 6 },
              { "path": "src/validation.ts", "startLine": 4, "endLine": 6 }
            ],
            "view": "overview"
          },
          {
            "id": "reserve",

    <script>
      /* Independent SVG graph viewer. No network, libraries or model calls. */
      (() => {
        'use strict';
        const graph = JSON.parse(document.getElementById('graph-data').textContent);
        const $ = (id) => document.getElementById(id);
        const ns = 'http://www.w3.org/2000/svg';
        const byId = new Map(graph.nodes.map((n) => [n.id, n]));
        const core = new Set(graph.nodes.filter((n) => n.core).map((n) => n.id));
        let visible = new Set(core),
          focus = null,
          neighborhood = new Set(),
          activeEdges = new Set();
        let camera = { x: 0, y: 0, scale: 1 };
        const freshNodes = new Set();
        const positions = new Map(),
          nodeEls = new Map(),
          edgeEls = new Map(),
          edgeLabels = new Map();
        const svg = $('graph'),
          viewport = $('viewport');
        const detailed = () => $('logic').checked;
        const eligible = (n) => detailed() || n.layer !== 'detail';
        const color = (n) =>
          n.kind === 'rule'
            ? '#efaa72'
            : n.kind === 'process'
              ? '#b39af5'
              : ['data', 'store'].includes(n.kind)
                ? '#6bbac5'
                : '#d9b77a';
        function element(tag, attrs = {}) {
          const el = document.createElementNS(ns, tag);
          for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
          return el;
        }
        function text(parent, tag, value, className) {
          const el = document.createElement(tag);
          el.textContent = value;
          if (className) el.className = className;
          parent.append(el);
          return el;
        }
        function evidence(parent, refs) {
          for (const r of refs)
            text(parent, 'p', `${r.path}:${r.startLine}–${r.endLine}`, 'source');
        }
        const available = () =>
          graph.edges.filter(
            (e) =>
              (e.status === 'supported' || $('inferred').checked) &&
              (e.view || 'both') !== (detailed() ? 'overview' : 'detail') &&
              eligible(byId.get(e.source)) &&
              eligible(byId.get(e.target)),
          );
        function walk(start) {
          const reached = new Set([start]),
            used = new Set();
          // Walk upstream/downstream separately: do not include siblings by changing direction midway.
          const modes =
            $('direction').value === 'both' ? ['upstream', 'downstream'] : [$('direction').value];
          for (const mode of modes) {
            let frontier = new Set([start]);
            const seen = new Set([start]);
            for (let depth = 0; depth < Number($('depth').value); depth++) {
              const next = new Set();
              for (const e of available()) {
                const from = mode === 'upstream' ? e.target : e.source;
                const to = mode === 'upstream' ? e.source : e.target;
                if (frontier.has(from)) {
                  reached.add(to);
                  used.add(e.id);
                  if (!seen.has(to)) {
                    seen.add(to);
                    next.add(to);
                  }
                }
              }
              frontier = next;
            }
          }
          return { reached, used };
        }
        function details() {
          const panel = $('details');

          if (!focus) {
            text(panel, 'span', '业务总览', 'badge');
            text(panel, 'h2', '沿数据流探索业务');
            text(
              panel,
              'p',
              '选择一个业务节点，展开它的上下游。已展开节点保留在画布中，无关部分淡化；搜索可定位尚未展开的节点。',
            );
            text(panel, 'h3', '分析范围');

          } else {
            const n = byId.get(focus);
            text(panel, 'span', n.kind, 'badge');
            text(panel, 'h2', n.label);
            text(panel, 'p', n.summary);
            if (n.rule) {
              text(panel, 'h3', '校验条件（成立即通过）');
              text(panel, 'p', n.rule.condition, 'source');
              text(panel, 'h3', '通过');
              text(panel, 'p', n.rule.onPass);
              text(panel, 'h3', '拒绝 / 失败');
              text(panel, 'p', n.rule.onFail);
            }
            const rules = graph.nodes.filter(
              (item) => item.parentId === n.id && item.kind === 'rule',
            );
            if (rules.length) {
              const button = text(panel, 'button', `查看 ${rules.length} 项校验规则`);
              button.onclick = () => {
                $('logic').checked = true;
                $('direction').value = 'both';
                visible = new Set(core);
                // Explicitly open the owned logic without inventing traversal edges.
                for (const item of graph.nodes.filter((item) => item.parentId === n.id))
                  visible.add(item.id);
                refresh();

            }
            for (const [field, label] of [
              ['inputs', '输入'],
              ['outputs', '输出'],
              ['states', '状态变化'],

              text(panel, 'h3', label);
              const ul = document.createElement('ul');
              panel.append(ul);
              for (const item of n[field].length ? n[field] : ['未记录']) text(ul, 'li', item);
            }
            text(panel, 'h3', '代码证据');
            evidence(panel, n.evidence);
            text(panel, 'h3', '直接关联 · 当前方向');
            for (const e of available().filter(
              (e) => activeEdges.has(e.id) && (e.source === focus || e.target === focus),
            )) {
              const box = document.createElement('div');
              box.className = 'relation';
              panel.append(box);
              text(box, 'p', `${byId.get(e.source).label} → ${byId.get(e.target).label}`);
              text(box, 'p', `${e.label} · ${e.status === 'inferred' ? '推测' : '有源码依据'}`);
              text(
                box,
                'p',
                `${e.flow === 'control' ? '执行条件 / 顺序' : '数据流'}${e.branch ? (e.branch === 'pass' ? ' · 通过' : ' · 拒绝') : ''}`,
              );
              text(box, 'p', e.reason);
              evidence(box, e.evidence);
              const target = e.source === focus ? e.target : e.source;
              const button = text(box, 'button', `探索 ${byId.get(target).label}`);
              button.onclick = () => select(target);
            }
          }
          for (const [field, label] of [
            ['limitations', '分析限制'],
            ['questions', '待确认'],
          ]) {
            text(panel, 'h3', label);
            const ul = document.createElement('ul');
            panel.append(ul);
            for (const item of graph[field].length ? graph[field] : ['无已记录项'])

          const result = focus ? walk(focus) : { reached: new Set(), used: new Set() };

            const owned = new Set(graph.nodes.filter((n) => n.parentId === focus).map((n) => n.id));
            for (const id of owned) neighborhood.add(id);
            // Keep the inputs and branch destinations visible at the boundary of this process.
            for (const e of available())
              if (owned.has(e.source) || owned.has(e.target)) {
                neighborhood.add(e.source);
                neighborhood.add(e.target);
              }
            for (const e of available())
              if (neighborhood.has(e.source) && neighborhood.has(e.target)) activeEdges.add(e.id);
          }
          for (const id of neighborhood) visible.add(id);
          const w = svg.clientWidth,
            h = svg.clientHeight;
          let index = 0;
          freshNodes.clear();
          for (const id of visible) {
            if (!positions.has(id)) {
              freshNodes.add(id);
              const angle = index * 2.39996;
              const origin = positions.get(focus) || { x: w / 2, y: h / 2 };
              positions.set(id, {
                x: origin.x + Math.cos(angle) * 145,
                y: origin.y + Math.sin(angle) * 125,
                vx: 0,
                vy: 0,
              });
            }
            index++;
          }
          for (const [id, el] of nodeEls)
            if (!visible.has(id)) {
              el.remove();
              nodeEls.delete(id);
            }
          for (const id of visible) {
            const n = byId.get(id);
            let el = nodeEls.get(id);
            if (!el) {
              el = element('g', {
                class: 'node',
                'data-node': id,
                role: 'button',
                tabindex: '0',
                'aria-label': n.label,
              });
              el.append(element('circle', { r: 20, fill: '#202738', stroke: color(n) }));
              const label = element('text', { y: 42, 'text-anchor': 'middle' });
              label.textContent = n.label;
              el.append(label);
              el.addEventListener('click', () => {
                if (!suppressClick) select(id);
              });
              el.addEventListener('keydown', (e) => {
                if (['Enter', ' '].includes(e.key)) {
                  e.preventDefault();
                  select(id);
                }
              });
              el.addEventListener('pointerdown', (e) => beginDrag(e, id));
              $('nodes').append(el);
              nodeEls.set(id, el);
            }
            el.style.opacity = !focus || neighborhood.has(id) ? '1' : '.17';
            el.setAttribute('aria-pressed', String(focus === id));
            el.setAttribute('data-kind', n.kind);
            el.querySelector('circle').setAttribute('r', focus === id ? 27 : 20);
            el.querySelector('circle').setAttribute('fill', focus === id ? '#66518a' : '#202738');
          }
          $('edges').replaceChildren();
          edgeEls.clear();
          edgeLabels.clear();
          for (const e of available().filter(
            (e) => visible.has(e.source) && visible.has(e.target),
          )) {
            const el = element('path', {
              class: `edge ${activeEdges.has(e.id) ? 'active' : ''} ${e.status} ${e.flow || 'data'} ${e.branch || ''}`,
              'data-edge': e.id,
              'marker-end': 'url(#arrow)',
            });
            el.style.opacity = !focus || activeEdges.has(e.id) ? '.85' : '.09';
            const title = element('title');
            title.textContent = `${e.label}: ${e.reason}`;
            el.append(title);
            $('edges').append(el);
            edgeEls.set(e.id, el);
            if (e.branch) {
              const label = element('text', {
                class: `branch-label ${e.branch}`,
                'text-anchor': 'middle',
              });
              label.textContent = e.branch === 'pass' ? '通过' : '拒绝';
              label.style.opacity = el.style.opacity;
              $('edges').append(label);
              edgeLabels.set(e.id, label);
            }
          }
          $('status').textContent =
            `${visible.size} / ${graph.nodes.filter(eligible).length} 个节点 · ${detailed() ? '包含业务逻辑校验' : '业务总览'} · ${focus ? `聚焦 ${byId.get(focus).label}` : '选择节点探索'}${detailed() && !graph.nodes.some((n) => n.kind === 'rule') ? ' · 当前报告未提取详细规则' : ''}`;
          details();
          settleLayout();
          if (focus) fitView(neighborhood, false);
        }
        function draw() {
          for (const [id, el] of nodeEls) {
            const p = positions.get(id);
            el.setAttribute('transform', `translate(${p.x},${p.y})`);
          }
          for (const e of graph.edges) {
            const el = edgeEls.get(e.id);
            if (!el) continue;
            const a = positions.get(e.source),
              b = positions.get(e.target);
            const label = edgeLabels.get(e.id);
            if (label) {
              label.setAttribute('x', (a.x + b.x) / 2);
              label.setAttribute('y', (a.y + b.y) / 2 - 6);
            }
            if (e.source === e.target) {
              el.setAttribute(
                'd',
                `M ${a.x - 14} ${a.y - 16} C ${a.x - 65} ${a.y - 85},${a.x + 65} ${a.y - 85},${a.x + 15} ${a.y - 18}`,
              );
              continue;
            }
            const dx = b.x - a.x,
              dy = b.y - a.y,
              dist = Math.hypot(dx, dy) || 1;
            const offset = graph.edges.filter(
              (other) => other.source === e.target && other.target === e.source,
            ).length
              ? 26
              : 0;
            const start = focus === e.source ? 30 : 23,
              end = focus === e.target ? 33 : 26;
            el.setAttribute(
              'd',
              `M ${a.x + (dx / dist) * start} ${a.y + (dy / dist) * start} Q ${(a.x + b.x) / 2 - (dy / dist) * offset} ${(a.y + b.y) / 2 + (dx / dist) * offset} ${b.x - (dx / dist) * end} ${b.y - (dy / dist) * end}`,
            );
          }
        }
        // Include the circle, its label and a breathing margin in the reserved rectangle.
        function nodeSize(id) {
          const label = nodeEls.get(id)?.querySelector('text');
          const measured = label?.getComputedTextLength?.();
          const estimate = [...byId.get(id).label].reduce(
            (n, c) => n + (c.codePointAt(0) > 255 ? 14 : 9),
            0,
          );
          return { halfWidth: Math.max(44, (measured || estimate) / 2 + 18), halfHeight: 60 };
        }
        function overlaps(a, b) {
          return (
            Math.abs(a.x - b.x) < a.halfWidth + b.halfWidth &&
            Math.abs(a.y - b.y) < a.halfHeight + b.halfHeight
          );
        }
        function distances(start, reverse) {
          const result = new Map([[start, 0]]),
            queue = [start];
          const edges = available().filter((e) => visible.has(e.source) && visible.has(e.target));
          for (let i = 0; i < queue.length; i++) {
            for (const e of edges) {
              const from = reverse ? e.target : e.source,
                to = reverse ? e.source : e.target;
              if (from === queue[i] && !result.has(to)) {
                result.set(to, result.get(from) + 1);
                queue.push(to);
              }
            }
          }
          return result;
        }
        function settleLayout(pinned = focus) {
          const anchor = positions.get(focus) || {
            x: svg.clientWidth / 2,
            y: svg.clientHeight / 2,
          };
          const up = focus ? distances(focus, true) : new Map(),
            down = focus ? distances(focus, false) : new Map();
          const lanes = new Map();
          // Existing nodes keep their positions unless there is a real collision. Fresh nodes
          // start in upstream/ downstream columns, not on top of the selected node.
          for (const id of freshNodes) {
            if (!visible.has(id) || id === focus) continue;
            const u = up.get(id),
              d = down.get(id);
            const rank = u !== undefined && (d === undefined || u < d) ? -u : (d ?? 0);
            const lane = lanes.get(rank) || 0;
            lanes.set(rank, lane + 1);
            const row = lane === 0 ? 0 : Math.ceil(lane / 2) * (lane % 2 ? 1 : -1);
            const p = positions.get(id);
            p.x = anchor.x + rank * 280;
            p.y = anchor.y + row * 140;
          }
          const ordered = [...visible].sort(
            (a, b) =>
              Number(b === pinned) - Number(a === pinned) ||
              Number(freshNodes.has(a)) - Number(freshNodes.has(b)),
          );
          const placed = [];
          for (const id of ordered) {
            const p = positions.get(id),
              size = nodeSize(id);
            let box = { ...size, x: p.x, y: p.y };
            if (placed.some((other) => overlaps(box, other))) {
              // Candidate boundaries guarantee a free position without squeezing into a viewport.
              // Search near the desired position, preferring vertical movement to retain flow columns.
              const candidates = [];
              for (const other of placed) {
                candidates.push(
                  { x: p.x, y: other.y - other.halfHeight - size.halfHeight - 2 },
                  { x: p.x, y: other.y + other.halfHeight + size.halfHeight + 2 },
                  { x: other.x - other.halfWidth - size.halfWidth - 2, y: p.y },
                  { x: other.x + other.halfWidth + size.halfWidth + 2, y: p.y },
                );
              }
              candidates.sort(
                (a, b) =>
                  1.4 * (a.x - p.x) ** 2 +
                  (a.y - p.y) ** 2 -
                  (1.4 * (b.x - p.x) ** 2 + (b.y - p.y) ** 2),
              );
              const free = candidates.find(
                (c) => !placed.some((other) => overlaps({ ...c, ...size }, other)),
              );
              // The outermost vertical candidate is always clear for a finite set of boxes.
              box = {
                ...size,
                ...(free || {
                  x: p.x,
                  y: Math.max(...placed.map((n) => n.y + n.halfHeight)) + size.halfHeight + 2,
                }),
              };
            }
            p.x = box.x;
            p.y = box.y;
            placed.push(box);
          }
          freshNodes.clear();
          draw();
        }
        function fitView(ids = visible, all = true) {
          const boxes = [...ids]
            .filter((id) => visible.has(id))
            .map((id) => ({ ...positions.get(id), ...nodeSize(id) }));
          if (!boxes.length) return;
          const left = Math.min(...boxes.map((p) => p.x - p.halfWidth)),
            right = Math.max(...boxes.map((p) => p.x + p.halfWidth));
          const top = Math.min(...boxes.map((p) => p.y - p.halfHeight)),
            bottom = Math.max(...boxes.map((p) => p.y + p.halfHeight));
          const width = Math.max(1, svg.clientWidth - 80),
            height = Math.max(1, svg.clientHeight - 100);
          const ideal = Math.min(1, width / (right - left), height / (bottom - top));
          const scale = Math.max(all ? 0.001 : 0.65, ideal);
          const center =
            !all && ideal < 0.65 && focus
              ? positions.get(focus)
              : { x: (left + right) / 2, y: (top + bottom) / 2 };
          camera = {
            scale,
            x: svg.clientWidth / 2 - center.x * scale,
            y: svg.clientHeight / 2 - center.y * scale,
          };
          transform();
        }
        function transform() {
          viewport.setAttribute(
            'transform',
            `translate(${camera.x},${camera.y}) scale(${camera.scale})`,
          );
        }
        function zoom(factor, x = svg.clientWidth / 2, y = svg.clientHeight / 2) {
          const scale = Math.max(0.001, Math.min(3, camera.scale * factor)),
            ratio = scale / camera.scale;
          camera.x = x - (x - camera.x) * ratio;
          camera.y = y - (y - camera.y) * ratio;
          camera.scale = scale;
          transform();
        }
        let drag = null,
          suppressClick = false;
        function beginDrag(e, id) {
          if (e.button !== 0) return;
          e.stopPropagation();
          suppressClick = false;
          drag = {
            id,
            x: e.clientX,
            y: e.clientY,
            lastX: e.clientX,
            lastY: e.clientY,
            moved: false,
          };
          svg.setPointerCapture(e.pointerId);
        }
        svg.addEventListener('pointerdown', (e) => {
          if (e.target === svg) beginDrag(e, null);
        });
        svg.addEventListener('pointermove', (e) => {
          if (!drag) return;
          const dx = e.clientX - drag.lastX,
            dy = e.clientY - drag.lastY;
          if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = true;
          if (drag.moved) {
            if (drag.id) {
              const p = positions.get(drag.id);
              p.x += dx / camera.scale;
              p.y += dy / camera.scale;
              draw();
            } else {
              camera.x += dx;
              camera.y += dy;
              transform();
            }
          }
          drag.lastX = e.clientX;
          drag.lastY = e.clientY;
        });
        function endDrag(e) {
          if (!drag) return;
          const d = drag;
          drag = null;
          suppressClick = d.moved;
          // Pointer capture retargets click to SVG, so handle a stationary node press here.
          if (!d.moved && d.id) {
            select(d.id);
            suppressClick = true;
          }
          if (d.moved && d.id) settleLayout(d.id);
          if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
          setTimeout(() => {
            suppressClick = false;
          }, 0);
        }
        svg.addEventListener('pointerup', endDrag);
        svg.addEventListener('pointercancel', () => {
          drag = null;
        });
        svg.addEventListener(
          'wheel',
          (e) => {
            e.preventDefault();
            const r = svg.getBoundingClientRect();
            zoom(Math.exp(-e.deltaY * 0.001), e.clientX - r.left, e.clientY - r.top);
          },
          { passive: false },
        );
        $('fit').onclick = () => fitView();
        $('zoom-in').onclick = () => zoom(1.2);
        $('zoom-out').onclick = () => zoom(1 / 1.2);
        for (const id of ['depth', 'direction', 'inferred'])
          $(id).onchange = () => {
            visible = new Set(core);
            refresh();
          };
        $('collapse').onclick = collapse;
        $('logic').onchange = () => {
          if (detailed() && !focus)
            focus = graph.nodes.find((n) => n.core && n.kind === 'process')?.id || null;
          if (focus && !eligible(byId.get(focus))) focus = byId.get(focus).parentId;
          visible = new Set(core);
          if (detailed() && focus) {
            const owner = byId.get(focus).parentId || focus;
            for (const n of graph.nodes.filter((n) => n.parentId === owner)) visible.add(n.id);
          }
          refresh();
          $('search').oninput();
        };
        $('reset').onclick = () => {
          camera = { x: 0, y: 0, scale: 1 };
          transform();
          $('depth').value = '1';
          $('direction').value = 'both';
          $('inferred').checked = false;
          $('logic').checked = false;
          $('search').value = '';
          $('results').replaceChildren();
          collapse();
        };
        $('search').oninput = () => {
          const q = $('search').value.trim().toLowerCase();
          $('results').replaceChildren();
          if (!q) return;
          const matches = graph.nodes.filter(
            (n) =>
              eligible(n) &&
              (n.label + ' ' + n.summary + ' ' + (n.rule?.condition || ''))
                .toLowerCase()
                .includes(q),
          );
          for (const n of matches.slice(0, 12)) {
            const b = text($('results'), 'button', n.label);
            b.onclick = () => {
              focus = null;
              select(n.id);
              fitView(neighborhood, false);
            };
          }
          if (!matches.length) text($('results'), 'span', '未找到匹配节点');
        };
        document.title = graph.title;
        $('title').textContent = graph.title;
        $('scope').textContent = graph.scope;
        new ResizeObserver(() => {
          settleLayout();
          if (focus) fitView(neighborhood, false);
        }).observe(svg);
        refresh();
      })();
    </script>
  </body>
</html>
